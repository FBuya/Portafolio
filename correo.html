<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FBuya</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Monsieur+La+Doulaise&family=Varela+Round&display=block"
        rel="stylesheet">


    <script>
        if (localStorage.getItem("modo-oscuro") === "true") {
            document.documentElement.classList.add("modo-oscuro");
        }
    </script>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
</head>

<body class="body-correo">

    <main>
        <div class="formulario-contacto">
            <form>
                <div class="campo"> 
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre">
                </div>

                <div class="campo">
                    <label for="apellido">Apellido:</label>
                    <input type="text" id="apellido" name="apellido" placeholder="Tu apellido">
                </div>

                <div class="campo">
                    <label for="mensaje">Mensaje:</label>
                    <textarea name="mensaje" id="mensaje" placeholder="Escribí tu mensaje"></textarea>
                </div>

                <div class="campo">
                    <button type="submit">Enviar</button>
                </div>
            </form>
        </div>
    </main>
    <footer class="footer-correo">
        <p>&copy; 2026 Franco Buyatti. Todos los derechos reservados.</p>
    </footer>
</body>

</html>
